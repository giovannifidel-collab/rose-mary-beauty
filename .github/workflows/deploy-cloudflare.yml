name: Rose&Mary Production Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'bundle/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rose-mary-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 6f6de52331e398c395d3de97c83011cd
    steps:
      - name: Check out encrypted public bridge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate public boundary and encrypted transport integrity
        run: python tools/validate_public_repo.py

      - name: Reconstruct authenticated encrypted envelope
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/chunks/part-* > /tmp/rose-mary-beauty.bundle.json
          test "$(wc -c < /tmp/rose-mary-beauty.bundle.json | tr -d ' ')" = '40915'
          test "$(sha256sum /tmp/rose-mary-beauty.bundle.json | awk '{print $1}')" = '3bd939d6c343fbc3cb4169df4b12566ec6fc71739daa7cd510c66614adbb408a'

      - name: Install pinned bundle cryptography
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'

      - name: Require trusted deploy secrets
        shell: bash
        env:
          BUNDLE_KEY: ${{ secrets.PFARMA_CI_BUNDLE_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ secrets.ROSEMARY_DATABASE_URL }}
          APP_PASSWORD: ${{ secrets.ROSEMARY_APP_PASSWORD }}
          AUTH_SECRET: ${{ secrets.ROSEMARY_AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.ROSEMARY_CRON_SECRET }}
        run: |
          set -euo pipefail
          for v in BUNDLE_KEY CF_TOKEN DB_URL APP_PASSWORD AUTH_SECRET CRON_SECRET; do
            test -n "${!v:-}" || { echo "Missing required secret: $v" >&2; exit 1; }
          done
          echo "PFARMA_CI_BUNDLE_KEY=$BUNDLE_KEY" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"

      - name: Decrypt exact source in ephemeral workspace
        run: python tools/public_ci_bundle.py unpack --bundle /tmp/rose-mary-beauty.bundle.json --destination .decrypted

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build vinext
        working-directory: .decrypted
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run build:vinext

      - name: Create ephemeral Cloudflare secrets file
        shell: python
        env:
          DATABASE_URL: ${{ secrets.ROSEMARY_DATABASE_URL }}
          ROSEMARY_APP_PASSWORD: ${{ secrets.ROSEMARY_APP_PASSWORD }}
          AUTH_SECRET: ${{ secrets.ROSEMARY_AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.ROSEMARY_CRON_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_CONTENT_SID: ${{ secrets.TWILIO_WHATSAPP_CONTENT_SID }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
        run: |
          import json, os
          keys = [
              'DATABASE_URL', 'ROSEMARY_APP_PASSWORD', 'AUTH_SECRET', 'CRON_SECRET',
              'TWILIO_ACCOUNT_SID', 'TWILIO_AUTH_TOKEN', 'TWILIO_WHATSAPP_FROM',
              'TWILIO_WHATSAPP_CONTENT_SID', 'TWILIO_SMS_FROM'
          ]
          payload = {key: os.environ[key] for key in keys if os.environ.get(key)}
          with open('/tmp/rose-mary-secrets.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, separators=(',', ':'))

      - name: Deploy to Cloudflare Workers with secrets encrypted at rest
        working-directory: .decrypted
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/server/wrangler.json
          npx wrangler@4.127.1 deploy \
            --config dist/server/wrangler.json \
            --secrets-file /tmp/rose-mary-secrets.json

      - name: Verify production health when origin is configured
        if: ${{ vars.ROSEMARY_ORIGIN != '' }}
        shell: bash
        env:
          ORIGIN: ${{ vars.ROSEMARY_ORIGIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS "$ORIGIN/api/health" > /tmp/health.json; then
              node -e "const h=require('/tmp/health.json');if(h.ok!==true||h.app!=='Rose&Mary Beauty'||h.database!=='connected')process.exit(1)" && exit 0
            fi
            sleep 5
          done
          echo 'Production health verification failed' >&2
          cat /tmp/health.json >&2 || true
          exit 1

      - name: Destroy decrypted workspace and ephemeral secret material
        if: always()
        shell: bash
        run: rm -rf .decrypted /tmp/rose-mary-beauty.bundle.json /tmp/rose-mary-secrets.json /tmp/health.json
